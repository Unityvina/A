<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chấm Công - VLBAOVE</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f6f9; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: #333; text-align: center; }
    button { padding: 12px 20px; font-size: 16px; margin: 8px 5px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-google { background: #db4437; color: white; }
    .btn-success { background: #28a745; color: white; }
    input, select { padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
    ul { list-style: none; padding: 0; }
    li { padding: 12px; background: #f8f9fa; margin: 6px 0; border-radius: 5px; border-left: 5px solid #28a745; }
    .history { margin-top: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login -->
    <div id="login-section">
      <h1>🔐 Hệ Thống Chấm Công</h1>
      <p style="text-align:center;">Chỉ cho phép: <strong>lapgia57@gmail.com</strong></p>
      <div style="text-align:center; margin:40px 0;">
        <button class="btn-google" onclick="loginWithGoogle()">Đăng nhập bằng Google</button>
      </div>
    </div>

    <!-- Attendance Panel -->
    <div id="attendance-section" style="display:none;">
      <h1>📋 Chấm Công</h1>
      <p>Xin chào, <strong id="user-email"></strong> | 
         <button onclick="logout()" style="background:#dc3545; color:white; padding:8px 16px;">Đăng xuất</button>
      </p>

      <hr>

      <!-- Chấm công mới -->
      <h2>Nhập chấm công mới</h2>
      <input type="text" id="employee-name" value="user1" placeholder="Tên nhân viên" />
      <input type="date" id="attendance-date" />
      <button class="btn-success" onclick="markAttendance()">✅ Chấm Công</button>

      <hr>

      <!-- Xem lịch sử -->
      <div class="history">
        <h2>Lịch sử chấm công</h2>
        <label>Chọn ngày: </label>
        <input type="date" id="view-date" onchange="loadAttendanceData()" />
        <ul id="attendance-list"></ul>
      </div>
    </div>
  </div>

  <script>
    // ================== CONFIG FIREBASE ==================
    const firebaseConfig = {
      apiKey: "AIzaSyB_fB6fPUZH4uJVpK9pzkjs7DP07kNW2MU",
      authDomain: "vlbaovework.firebaseapp.com",
      databaseURL: "https://vlbaovework-default-rtdb.firebaseio.com",
      projectId: "vlbaovework",
      storageBucket: "vlbaovework.firebasestorage.app",
      messagingSenderId: "478788881372",
      appId: "1:478788881372:web:a3cfc3f6ce2c22cc0c9d19"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ================== GOOGLE LOGIN ==================
    async function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;

        if (user.email !== "lapgia57@gmail.com") {
          alert("❌ Chỉ email lapgia57@gmail.com được phép truy cập!");
          await auth.signOut();
          return;
        }

        document.getElementById("login-section").style.display = "none";
        document.getElementById("attendance-section").style.display = "block";
        document.getElementById("user-email").textContent = user.email;

        // Set ngày mặc định là hôm nay
        const today = new Date().toISOString().split('T')[0];
        document.getElementById("attendance-date").value = today;
        document.getElementById("view-date").value = today;

        loadAttendanceData();
      } catch (error) {
        alert("Lỗi đăng nhập: " + error.message);
      }
    }

    function logout() {
      auth.signOut().then(() => {
        document.getElementById("login-section").style.display = "block";
        document.getElementById("attendance-section").style.display = "none";
      });
    }

    // ================== CHẤM CÔNG MỚI ==================
    async function markAttendance() {
      const name = document.getElementById("employee-name").value.trim();
      let date = document.getElementById("attendance-date").value;

      if (!name) {
        alert("Vui lòng nhập tên nhân viên!");
        return;
      }
      if (!date) date = new Date().toISOString().split('T')[0];

      const time = new Date().toLocaleTimeString('vi-VN');

      try {
        await db.ref('attendance/' + date).push({
          name: name,
          time: time,
          timestamp: Date.now()
        });

        alert(`✅ Đã chấm công: ${name} vào ngày ${date}`);
        loadAttendanceData(); // Refresh danh sách
      } catch (e) {
        alert("Lỗi: " + e.message);
      }
    }

    // ================== TẢI DỮ LIỆU NODE CŨ ==================
    function loadAttendanceData() {
      const selectedDate = document.getElementById("view-date").value || 
                          new Date().toISOString().split('T')[0];
      const list = document.getElementById("attendance-list");

      db.ref('attendance/' + selectedDate).once('value', (snapshot) => {
        list.innerHTML = `<h3>Ngày ${selectedDate}</h3>`;

        if (!snapshot.exists()) {
          list.innerHTML += "<li>Chưa có dữ liệu chấm công cho ngày này.</li>";
          return;
        }

        snapshot.forEach(child => {
          const data = child.val();
          const li = document.createElement('li');
          li.innerHTML = `<strong>${data.name}</strong> — ${data.time}`;
          list.appendChild(li);
        });
      });
    }

    // Theo dõi trạng thái đăng nhập
    auth.onAuthStateChanged(user => {
      if (user && user.email === "lapgia57@gmail.com") {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("attendance-section").style.display = "block";
        document.getElementById("user-email").textContent = user.email;

        const today = new Date().toISOString().split('T')[0];
        document.getElementById("attendance-date").value = today;
        document.getElementById("view-date").value = today;
        loadAttendanceData();
      }
    });
  </script>
</body>
</html>
